<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><meta name="supported-color-schemes" content="dark">
<!-- @darkmode -->
</head>
<body class="body" style="margin:0;padding:0;background:#0e0e10;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#0e0e10" style="background:#0e0e10;background-image:linear-gradient(#0e0e10,#0e0e10);"><tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" bgcolor="#18181c" style="max-width:600px;width:100%;background:#18181c;background-image:linear-gradient(#18181c,#18181c);">
<tr><td height="4" style="height:4px;line-height:4px;font-size:0;background:#d6f20a;background-image:linear-gradient(#d6f20a,#d6f20a);">&nbsp;</td></tr>
<tr><td style="padding:28px 28px 8px;color:#d6f20a;font-size:28px;font-weight:900;font-style:italic;"><div class="gb-s"><div class="gb-d">#32 <span style="color:#f2f2f2;font-size:18px;letter-spacing:2px;font-style:normal;">NEW ENQUIRY</span></div></div></td></tr>
<tr><td style="padding:0 28px 20px;color:#9a9aa3;font-size:13px;"><div class="gb-s"><div class="gb-d">From the lewissmartracing.com contact form &middot; {{submittedAt}}</div></div></td></tr>
<tr><td style="padding:0 28px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="color:#f2f2f2;font-size:15px;">
<tr><td style="padding:8px 0;color:#9a9aa3;width:110px;"><div class="gb-s"><div class="gb-d">Topic</div></div></td><td style="padding:8px 0;font-weight:bold;color:#d6f20a;"><div class="gb-s"><div class="gb-d">{{topic}}</div></div></td></tr>
<tr><td style="padding:8px 0;color:#9a9aa3;"><div class="gb-s"><div class="gb-d">Name</div></div></td><td style="padding:8px 0;"><div class="gb-s"><div class="gb-d">{{name}}</div></div></td></tr>
<tr><td style="padding:8px 0;color:#9a9aa3;"><div class="gb-s"><div class="gb-d">Email</div></div></td><td style="padding:8px 0;"><div class="gb-s"><div class="gb-d"><a href="mailto:{{email}}" style="color:#c9b6ff;">{{email}}</a></div></div></td></tr>
<tr><td style="padding:8px 0;color:#9a9aa3;"><div class="gb-s"><div class="gb-d">Company</div></div></td><td style="padding:8px 0;"><div class="gb-s"><div class="gb-d">{{company}}</div></div></td></tr>
</table></td></tr>
<tr><td style="padding:16px 28px 0;color:#9a9aa3;font-size:13px;"><div class="gb-s"><div class="gb-d">Message</div></div></td></tr>
<tr><td style="padding:8px 28px 24px;color:#f2f2f2;font-size:15px;line-height:1.55;white-space:pre-wrap;"><div class="gb-s"><div class="gb-d">{{message}}</div></div></td></tr>
<tr><td style="padding:0 28px 28px;"><a href="mailto:{{email}}?subject=Re:%20your%20enquiry%20to%20Lewis%20Smart%20%2332" target="_blank" rel="noopener"><img src="https://cdn.bluefox.email/668d0d8f71935df50e4d0f11/6af3945f22a3fca8ecbd6b40/O8rnpMz0LMksU5IGoSCy3.png" width="104" height="48" alt="REPLY TO {{name}}" style="display:block;border:0;width:104px;height:48px;"></a></td></tr>
</table></td></tr></table>
</body></html>
